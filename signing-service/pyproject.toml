[project]
name = "signing-service"
version = "0.1.0"
description = "Cloud Run service issuing short-lived GCS V4 signed URLs, gated on Supabase JWT + RLS (action-plan.md §6, §10)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "google-auth>=2.30",
  "google-cloud-storage>=2.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
