# Local Supabase CLI config. The live project must be created in region
# eu-central-1 (Frankfurt) — this setting is immutable once the project
# exists (action-plan.md §3). This file only configures the local dev stack.

project_id = "reporting-platform"

[api]
enabled = true
port = 54321

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

[auth.email]
enable_signup = false  # users are invited by an admin, not self-registered
