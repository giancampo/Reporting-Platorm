[project]
name = "reporting-etl"
version = "0.1.0"
description = "Nightly extraction job for the multi-client reporting platform (Cloud Run Jobs)."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "google-analytics-data>=0.18",
  "google-analytics-admin>=0.14",
  "google-auth>=2.30",
  "boto3>=1.34",           # S3-compatible client, used against the R2 endpoint
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "freezegun>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
