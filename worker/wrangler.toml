# Cloudflare Worker: the only path allowed to read reporting data out of R2
# (action-plan.md §10: "no path where the frontend requests an R2 file
# without going through the Worker"). Deployed on Cloudflare Pages/Workers —
# no data resides here, so the EU-residency requirement is satisfied by the
# R2 bucket and Supabase project it talks to, not by this config.

name = "reporting-platform-worker"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[[r2_buckets]]
binding = "REPORTING_DATA"
bucket_name = "reporting-platform-data"
# The bucket MUST be created with the `eu` jurisdiction (immutable at
# creation time, action-plan.md §3). Wrangler's R2 binding works transparently
# against a jurisdiction-bound bucket; only some dashboard tooling does not.

# Set with `wrangler secret put SUPABASE_JWT_SECRET` / `SUPABASE_URL` /
# `SUPABASE_ANON_KEY` — never committed here.
[vars]
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
